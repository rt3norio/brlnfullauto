
services:
  i2pd:
    image: purplei2p/i2pd:latest
    container_name: i2pd
    ports:
      - "4444:4444"  # HTTP proxy
      - "4447:4447"  # SAM
      - "7656:7656"  # I2P control
    volumes:
      - ./i2pd_data:/var/lib/i2pd  # Persistent storage
    restart: unless-stopped
    networks:
      - i2pd-network

networks:
  i2pd-network:
    driver: bridge
